name: StaySignal CI

on:
  push:
    paths:
      - "staysignal/**"
      - ".github/workflows/staysignal-ci.yml"
  pull_request:
    paths:
      - "staysignal/**"
      - ".github/workflows/staysignal-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staysignal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: staysignal/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_demo_data.py --rows 2000
      - run: PYTHONPATH=src python scripts/run_analysis.py

