<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title">
  <title id="title">Product verification workflow</title>
  <rect width="1200" height="750" fill="#eef0f4"/>
  <text x="76" y="108" font-family="Arial,sans-serif" font-size="24" fill="#647086">SUPPLY-CHAIN TRACE</text>
  <text x="76" y="180" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#333a44">Product verification</text>
  <path d="M190 408H1010" stroke="#9ba7b8" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="190" cy="408" r="76" fill="#d8e2dc" stroke="#82998b" stroke-width="4"/><text x="190" y="402" font-size="24" fill="#4f6458">MAKE</text><text x="190" y="435" font-size="17" fill="#68776f">record</text>
    <circle cx="462" cy="408" r="76" fill="#dde2ed" stroke="#8796b0" stroke-width="4"/><text x="462" y="402" font-size="24" fill="#56657e">SHIP</text><text x="462" y="435" font-size="17" fill="#6a7484">trace</text>
    <circle cx="738" cy="408" r="76" fill="#e8dde8" stroke="#a08ca2" stroke-width="4"/><text x="738" y="402" font-size="24" fill="#6e5b71">SELL</text><text x="738" y="435" font-size="17" fill="#7d6d80">confirm</text>
    <circle cx="1010" cy="408" r="76" fill="#d8e2dc" stroke="#82998b" stroke-width="4"/><text x="1010" y="398" font-size="44" fill="#4f6458">✓</text><text x="1010" y="443" font-size="17" fill="#68776f">verified</text>
  </g>
  <rect x="360" y="560" width="480" height="84" rx="20" fill="#faf9f6" stroke="#aab1bd" stroke-width="3"/>
  <text x="600" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#515963">Solidity · Ethereum · MetaMask</text>
</svg>
